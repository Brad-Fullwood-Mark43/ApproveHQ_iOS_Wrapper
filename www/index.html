<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b4f8a" />
  <title>ApproveHQ</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fa;color:#142033}body{min-height:100vh;min-height:100dvh}.app{min-height:100vh;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 32px) 24px calc(env(safe-area-inset-bottom) + 24px);display:flex;align-items:center;justify-content:center}.card{width:100%;max-width:430px;background:#fff;border-radius:24px;padding:32px 24px;box-shadow:0 18px 50px rgba(20,32,51,.12)}.brand{display:flex;align-items:center;gap:14px;margin-bottom:30px}.mark{width:54px;height:54px;border-radius:15px;background:linear-gradient(145deg,#0b63a7,#073b6c);display:grid;place-items:center;color:white;font-size:27px;font-weight:800}.brand h1{font-size:28px;margin:0}.brand p{margin:3px 0 0;color:#68758a;font-size:14px}h2{font-size:22px;margin:0 0 8px}.sub{color:#68758a;margin:0 0 24px;line-height:1.45}.field{margin-bottom:16px}label{display:block;font-weight:650;font-size:14px;margin:0 0 7px}input,select{width:100%;height:52px;border:1px solid #ccd4df;border-radius:12px;padding:0 14px;font-size:17px;background:#fff;color:#142033;outline:none}input:focus,select:focus{border-color:#0b63a7;box-shadow:0 0 0 3px rgba(11,99,167,.12)}button{width:100%;height:52px;border:0;border-radius:12px;background:#0b63a7;color:#fff;font-size:17px;font-weight:700;margin-top:6px}button:disabled{opacity:.55}.error{display:none;background:#fff1f1;color:#a12424;border-radius:10px;padding:11px 12px;margin:0 0 16px;font-size:14px}.status{margin-top:18px;text-align:center;color:#7b8797;font-size:12px}.hidden{display:none}
  </style>
</head>
<body>
  <main class="app">
    <section class="card">
      <div class="brand"><div class="mark">A✓</div><div><h1>ApproveHQ</h1><p>Customer approvals, simplified.</p></div></div>
      <div id="error" class="error"></div>
      <form id="loginForm">
        <h2>Sign in</h2>
        <p class="sub">Use the same phone number and passphrase you use for ApproveHQ on the web.</p>
        <div class="field"><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="(555) 555-5555" required /></div>
        <div id="businessField" class="field hidden"><label for="business">Business</label><select id="business" name="business"></select></div>
        <div class="field"><label for="passphrase">Passphrase</label><input id="passphrase" name="passphrase" type="password" autocomplete="current-password" required /></div>
        <button id="signIn" type="submit">Sign in</button>
      </form>
      <div class="status">Native mobile preview</div>
    </section>
  </main>
  <script>
    const API_BASE='https://www.4fenterprises.org';
    const form=document.getElementById('loginForm');const phone=document.getElementById('phone');const passphrase=document.getElementById('passphrase');const businessField=document.getElementById('businessField');const business=document.getElementById('business');const errorBox=document.getElementById('error');const button=document.getElementById('signIn');
    function showError(message){errorBox.textContent=message;errorBox.style.display=message?'block':'none'}
    async function api(path,body){const response=await fetch(API_BASE+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let data={};try{data=await response.json()}catch{}return{response,data}}
    phone.addEventListener('blur',async()=>{const value=phone.value.trim();if(!value)return;try{const {response,data}=await api('/api/auth/login',{phone:value,probe:true});if(response.ok&&Array.isArray(data.memberships)&&data.memberships.length>1){business.innerHTML=data.memberships.map(m=>`<option value="${m.businessId}">${m.businessName}</option>`).join('');businessField.classList.remove('hidden')}else{businessField.classList.add('hidden')}}catch{}});
    form.addEventListener('submit',async(event)=>{event.preventDefault();showError('');button.disabled=true;button.textContent='Signing in…';try{const payload={phone:phone.value.trim(),passphrase:passphrase.value};if(!businessField.classList.contains('hidden'))payload.businessId=Number(business.value);const {response,data}=await api('/api/auth/login',payload);if(!response.ok){showError(data.error||'Unable to sign in.');return}document.querySelector('.card').innerHTML='<div class="brand"><div class="mark">A✓</div><div><h1>ApproveHQ</h1><p>Signed in</p></div></div><h2>Mobile connection successful</h2><p class="sub">The native ApproveHQ shell reached the existing backend. Jobs are the next screen.</p>'}catch(err){showError('Could not reach ApproveHQ. Check your connection and try again.')}finally{button.disabled=false;button.textContent='Sign in'}});
  </script>
</body>
</html>

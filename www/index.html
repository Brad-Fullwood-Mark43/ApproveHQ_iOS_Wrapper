<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b4f8a" />
  <title>ApproveHQ</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fa;color:#142033}body{min-height:100vh;min-height:100dvh}.app{min-height:100vh;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 20px) 18px calc(env(safe-area-inset-bottom) + 20px)}.shell{width:100%;max-width:520px;margin:0 auto}.card{background:#fff;border-radius:24px;padding:28px 22px;box-shadow:0 18px 50px rgba(20,32,51,.10)}.brand{display:flex;align-items:center;gap:14px;margin-bottom:26px}.mark{width:54px;height:54px;border-radius:15px;background:linear-gradient(145deg,#0b63a7,#073b6c);display:grid;place-items:center;color:white;font-size:27px;font-weight:800}.brand h1{font-size:28px;margin:0}.brand p{margin:3px 0 0;color:#68758a;font-size:14px}h2{font-size:22px;margin:0 0 8px}.sub{color:#68758a;margin:0 0 22px;line-height:1.45}.field{margin-bottom:16px}label{display:block;font-weight:650;font-size:14px;margin:0 0 7px}input,select{width:100%;height:52px;border:1px solid #ccd4df;border-radius:12px;padding:0 14px;font-size:17px;background:#fff;color:#142033;outline:none}input:focus,select:focus{border-color:#0b63a7;box-shadow:0 0 0 3px rgba(11,99,167,.12)}button{height:46px;border:0;border-radius:12px;background:#0b63a7;color:#fff;font-size:16px;font-weight:700;padding:0 16px}button:disabled{opacity:.55}.primary{width:100%;height:52px;font-size:17px}.error{display:none;background:#fff1f1;color:#a12424;border-radius:10px;padding:11px 12px;margin:0 0 16px;font-size:14px}.hidden{display:none!important}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.topbar h2{margin:0}.actions{display:flex;gap:10px;align-items:center}.linkbtn{height:auto;background:transparent;color:#0b63a7;padding:8px 2px;font-size:15px}.jobs{display:grid;gap:12px}.job{background:#fff;border-radius:16px;padding:16px 17px;box-shadow:0 8px 25px rgba(20,32,51,.07);cursor:pointer}.job:active{transform:scale(.99)}.job-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.job-number{font-size:13px;color:#68758a;margin-bottom:4px}.job-title{font-size:17px;font-weight:750}.job-customer{font-size:14px;color:#68758a;margin-top:5px}.status-pill{font-size:12px;font-weight:700;text-transform:capitalize;background:#eef3f8;border-radius:999px;padding:6px 9px;white-space:nowrap}.view-row{display:flex;justify-content:flex-end;margin-top:12px}.view-link{font-size:14px;font-weight:700;color:#0b63a7}.empty,.loading{text-align:center;color:#68758a;background:#fff;border-radius:16px;padding:28px 18px}.detail-card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 8px 25px rgba(20,32,51,.07);margin-bottom:14px}.detail-title{font-size:21px;font-weight:800;margin:4px 0}.detail-meta{color:#68758a;font-size:14px;line-height:1.5}.section-title{font-size:16px;font-weight:800;margin:0 0 12px}.comment{padding:12px 0;border-top:1px solid #edf0f4}.comment:first-of-type{border-top:0}.comment-author{font-size:13px;font-weight:700}.comment-body{margin-top:4px;font-size:15px;line-height:1.4}.photo-count{font-size:15px;color:#4f5d70}.footer{margin-top:18px;text-align:center;color:#8a95a5;font-size:12px}
  </style>
</head>
<body>
  <main class="app">
    <div class="shell">
      <section id="loginView" class="card">
        <div class="brand"><div class="mark">A✓</div><div><h1>ApproveHQ</h1><p>Customer approvals, simplified.</p></div></div>
        <div id="error" class="error"></div>
        <form id="loginForm">
          <h2>Sign in</h2>
          <p class="sub">Use the same phone number and passphrase you use for ApproveHQ on the web.</p>
          <div class="field"><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="(555) 555-5555" required /></div>
          <div id="businessField" class="field hidden"><label for="business">Business</label><select id="business" name="business"></select></div>
          <div class="field"><label for="passphrase">Passphrase</label><input id="passphrase" name="passphrase" type="password" autocomplete="current-password" required /></div>
          <button id="signIn" class="primary" type="submit">Sign in</button>
        </form>
      </section>

      <section id="jobsView" class="hidden">
        <div class="topbar">
          <div><div id="businessName" class="job-number">ApproveHQ</div><h2>Jobs</h2></div>
          <div class="actions"><button id="refreshJobs" class="linkbtn" type="button">Refresh</button><button id="signOut" class="linkbtn" type="button">Sign out</button></div>
        </div>
        <div id="jobsMessage" class="loading">Loading jobs…</div>
        <div id="jobs" class="jobs"></div>
      </section>

      <section id="detailView" class="hidden">
        <div class="topbar"><button id="backToJobs" class="linkbtn" type="button">‹ Jobs</button><div class="actions"><button id="refreshJob" class="linkbtn" type="button">Refresh</button></div></div>
        <div id="detailMessage" class="loading">Loading job…</div>
        <div id="detailContent" class="hidden"></div>
      </section>

      <div class="footer">ApproveHQ mobile preview · Staging</div>
    </div>
  </main>

  <script>
    const API_BASE='https://cncapproval-staging.up.railway.app';
    let mobileToken=null;
    let currentUser=null;
    let currentJobId=null;

    const loginView=document.getElementById('loginView');
    const jobsView=document.getElementById('jobsView');
    const detailView=document.getElementById('detailView');
    const form=document.getElementById('loginForm');
    const phone=document.getElementById('phone');
    const passphrase=document.getElementById('passphrase');
    const businessField=document.getElementById('businessField');
    const business=document.getElementById('business');
    const errorBox=document.getElementById('error');
    const button=document.getElementById('signIn');
    const jobsEl=document.getElementById('jobs');
    const jobsMessage=document.getElementById('jobsMessage');
    const businessName=document.getElementById('businessName');
    const detailMessage=document.getElementById('detailMessage');
    const detailContent=document.getElementById('detailContent');

    function showError(message){errorBox.textContent=message;errorBox.style.display=message?'block':'none'}

    async function post(path,body){
      const response=await fetch(API_BASE+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      let data={};try{data=await response.json()}catch{}
      return{response,data};
    }

    async function get(path){
      const response=await fetch(API_BASE+path,{headers:{Authorization:`Bearer ${mobileToken}`}});
      let data={};try{data=await response.json()}catch{}
      return{response,data};
    }

    phone.addEventListener('blur',async()=>{
      const value=phone.value.trim();if(!value)return;
      try{
        const {response,data}=await post('/api/mobile/auth/login',{phone:value,probe:true});
        if(response.ok&&Array.isArray(data.memberships)&&data.memberships.length>1){
          business.innerHTML=data.memberships.map(m=>`<option value="${m.businessId}">${escapeHtml(m.businessName)}</option>`).join('');
          businessField.classList.remove('hidden');
        }else{businessField.classList.add('hidden')}
      }catch{}
    });

    async function loadJobs(){
      jobsEl.innerHTML='';jobsMessage.textContent='Loading jobs…';jobsMessage.classList.remove('hidden');
      try{
        const {response,data}=await get('/api/mobile/jobs');
        if(!response.ok){jobsMessage.textContent=data.error||'Could not load jobs.';return;}
        const jobs=Array.isArray(data.jobs)?data.jobs:[];
        if(!jobs.length){jobsMessage.textContent='No jobs yet.';return;}
        jobsMessage.classList.add('hidden');
        jobsEl.innerHTML=jobs.map(job=>`<article class="job" data-job-id="${job.id}"><div class="job-head"><div><div class="job-number">Job #${job.number}</div><div class="job-title">${escapeHtml(job.title)}</div><div class="job-customer">${escapeHtml(job.customer_name||'No customer')}</div></div><div class="status-pill">${escapeHtml((job.status||'').replaceAll('_',' '))}</div></div><div class="view-row"><span class="view-link">View job ›</span></div></article>`).join('');
        jobsEl.querySelectorAll('[data-job-id]').forEach(el=>el.addEventListener('click',()=>openJob(Number(el.dataset.jobId))));
      }catch{jobsMessage.textContent='Could not reach staging. Try Refresh.'}
    }

    async function openJob(id){
      currentJobId=id;
      jobsView.classList.add('hidden');detailView.classList.remove('hidden');
      detailContent.classList.add('hidden');detailMessage.classList.remove('hidden');detailMessage.textContent='Loading job…';
      try{
        const {response,data}=await get(`/api/mobile/jobs/${id}`);
        if(!response.ok){detailMessage.textContent=data.error||'Could not load job.';return;}
        const job=data.job||{};const comments=Array.isArray(data.comments)?data.comments:[];const photos=Array.isArray(data.photos)?data.photos:[];const approvals=Array.isArray(data.approvals)?data.approvals:[];
        detailContent.innerHTML=`
          <div class="detail-card"><div class="job-number">Job #${escapeHtml(job.number)}</div><div class="detail-title">${escapeHtml(job.title||'Untitled job')}</div><div class="status-pill" style="display:inline-block;margin:6px 0 12px">${escapeHtml((job.status||'').replaceAll('_',' '))}</div><div class="detail-meta"><strong>Customer:</strong> ${escapeHtml(job.customer_name||'—')}<br>${job.customer_company?`<strong>Company:</strong> ${escapeHtml(job.customer_company)}<br>`:''}${job.description?`<br>${escapeHtml(job.description)}`:''}</div></div>
          <div class="detail-card"><div class="section-title">Photos & approvals</div><div class="photo-count">${photos.length} photo${photos.length===1?'':'s'} · ${approvals.length} approval event${approvals.length===1?'':'s'}</div></div>
          <div class="detail-card"><div class="section-title">Comments</div>${comments.length?comments.map(c=>`<div class="comment"><div class="comment-author">${escapeHtml(c.author_name||c.author_type||'Comment')}</div><div class="comment-body">${escapeHtml(c.body||'')}</div></div>`).join(''):'<div class="detail-meta">No comments yet.</div>'}</div>`;
        detailMessage.classList.add('hidden');detailContent.classList.remove('hidden');
      }catch{detailMessage.textContent='Could not load this job. Try Refresh.'}
    }

    function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}

    form.addEventListener('submit',async(event)=>{
      event.preventDefault();showError('');button.disabled=true;button.textContent='Signing in…';
      try{
        const payload={phone:phone.value.trim(),passphrase:passphrase.value,deviceName:'ApproveHQ iOS'};
        if(!businessField.classList.contains('hidden'))payload.businessId=Number(business.value);
        const {response,data}=await post('/api/mobile/auth/login',payload);
        if(!response.ok){showError(data.error||'Unable to sign in.');return;}
        mobileToken=data.token;currentUser=data.user;businessName.textContent=currentUser?.businessName||'ApproveHQ';
        loginView.classList.add('hidden');detailView.classList.add('hidden');jobsView.classList.remove('hidden');
        await loadJobs();
      }catch{showError('Could not reach ApproveHQ staging. Check your connection and try again.')}finally{button.disabled=false;button.textContent='Sign in'}
    });

    document.getElementById('refreshJobs').addEventListener('click',loadJobs);
    document.getElementById('refreshJob').addEventListener('click',()=>currentJobId&&openJob(currentJobId));
    document.getElementById('backToJobs').addEventListener('click',()=>{detailView.classList.add('hidden');jobsView.classList.remove('hidden')});
    document.getElementById('signOut').addEventListener('click',()=>{
      mobileToken=null;currentUser=null;currentJobId=null;passphrase.value='';jobsEl.innerHTML='';detailContent.innerHTML='';detailView.classList.add('hidden');jobsView.classList.add('hidden');loginView.classList.remove('hidden');
    });
  </script>
</body>
</html>
